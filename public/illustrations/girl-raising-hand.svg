<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 200">
  <!-- soft background -->
  <circle cx="75" cy="112" r="68" fill="#E0F2FE"/>

  <!-- legs -->
  <rect x="61" y="142" width="10" height="40" rx="5" fill="#5C3A21"/>
  <rect x="79" y="142" width="10" height="40" rx="5" fill="#5C3A21"/>
  <!-- socks and shoes -->
  <rect x="61" y="172" width="10" height="9" fill="#FFFFFF"/>
  <rect x="79" y="172" width="10" height="9" fill="#FFFFFF"/>
  <path d="M58 183c0-3 3-4 7-4h7v6H58z" fill="#1F1A17"/>
  <path d="M92 183c0-3-3-4-7-4h-7v6h14z" fill="#1F1A17"/>

  <!-- skirt -->
  <path d="M55 108h40l7 38H48z" fill="#075985"/>
  <path d="M65 110l-3 36M75 110v36M85 110l3 36" stroke="#0A4A6E" stroke-width="1.5"/>

  <!-- torso: school shirt -->
  <path d="M53 76c0-8 9-14 22-14s22 6 22 14v34H53z" fill="#00A1DE"/>
  <path d="M68 63l7 8 7-8" fill="#FFFFFF"/>
  <path d="M75 71v37" stroke="#0284C7" stroke-width="1.6"/>

  <!-- left arm holding books against the body -->
  <path d="M56 76c-6 10-7 20-4 30" fill="none" stroke="#00A1DE" stroke-width="10" stroke-linecap="round"/>
  <rect x="44" y="94" width="20" height="26" rx="2" fill="#FAD201" transform="rotate(-8 54 107)"/>
  <rect x="47" y="96" width="20" height="24" rx="2" fill="#0369A1" transform="rotate(-8 57 108)"/>
  <ellipse cx="57" cy="110" rx="5.5" ry="4.5" fill="#5C3A21"/>

  <!-- right arm raised -->
  <path d="M94 74c8-12 14-30 16-52" fill="none" stroke="#00A1DE" stroke-width="10" stroke-linecap="round"/>
  <path d="M110 30l2-16" stroke="#5C3A21" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="112.5" cy="11" rx="5.5" ry="6.5" fill="#5C3A21"/>

  <!-- neck -->
  <rect x="69" y="50" width="12" height="14" rx="4" fill="#5C3A21"/>
  <!-- head: oval, older proportions -->
  <ellipse cx="75" cy="36" rx="13" ry="16" fill="#5C3A21"/>
  <ellipse cx="62" cy="38" rx="2.6" ry="4" fill="#4A2E1A"/>
  <ellipse cx="88" cy="38" rx="2.6" ry="4" fill="#4A2E1A"/>
  <!-- short school haircut -->
  <path d="M62 34c0-11 6-16 13-16s13 5 13 16c-3-5-8-8-13-8s-10 3-13 8z" fill="#1F1A17"/>
  <!-- face -->
  <ellipse cx="70" cy="37" rx="1.8" ry="2.2" fill="#1F1A17"/>
  <ellipse cx="80" cy="37" rx="1.8" ry="2.2" fill="#1F1A17"/>
  <path d="M66 32.5l6-1M78 31.5l6 1" stroke="#1F1A17" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M70 44q5 4 10 0" fill="#FFFFFF" stroke="#3A2416" stroke-width="1.6" stroke-linejoin="round"/>
</svg>
